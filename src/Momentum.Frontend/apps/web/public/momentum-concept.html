function fitDeliveryChart(){const svg=$('.delivery-chart');if(!svg)return;const style=getComputedStyle(svg),width=svg.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight),height=svg.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);if(width<100||height<60)return;if(!svg.dataset.plotBounds){const ticks=[...svg.querySelectorAll('line')].map(n=>Number(n.getAttribute('y1'))),labels=[...svg.querySelectorAll('text')].map(n=>Number(n.getAttribute('y')));svg.dataset.plotBounds=JSON.stringify({low:Math.min(...ticks),high:Math.max(...ticks),date:Math.max(...labels)})}const base=JSON.parse(svg.dataset.plotBounds);svg.setAttribute('viewBox',`0 0 ${width} ${height}`);const x=v=>40+(v-40)/640*(width-64),y=v=>height-25-(base.high-v)/(base.high-base.low)*(height-43);for(const el of svg.querySelectorAll('line,circle,polyline,text')){if(!el.dataset.plotOriginal)el.dataset.plotOriginal=JSON.stringify(Object.fromEntries(['x','y','x1','x2','y1','y2','cx','cy','points'].filter(k=>el.hasAttribute(k)).map(k=>[k,el.getAttribute(k)])));const original=JSON.parse(el.dataset.plotOriginal);for(const [key,value] of Object.entries(original)){if(key==='points'){el.setAttribute(key,value.split(' ').map(pair=>{const [a,b]=pair.split(',').map(Number);return x(a)+','+y(b)}).join(' '));continue}const v=Number(value);el.setAttribute(key,key==='x'&&v<40?v:key.startsWith('x')||key==='cx'?x(v):el.tagName.toLowerCase()==='text'?(v===base.date?height-6:y(v-4)+4):y(v))}}}
window.addEventListener('resize',fitDeliveryChart);
function bindPortfolio(){fitDeliveryChart();for(const [id,set] of [['portfolio-project',v=>{portfolioProject=v;portfolioChart='burnup'}],['portfolio-range',v=>portfolioRange=v],['portfolio-cadence',v=>portfolioCadence=v],['portfolio-chart',v=>portfolioChart=v]])if($('#'+id))$('#'+id).onchange=e=>{set(e.target.value);updateWorkspace()};main.querySelectorAll('[data-project-scope]').forEach(b=>b.onclick=()=>{portfolioProject=b.dataset.projectScope;portfolioChart='burnup';updateWorkspace()});main.querySelectorAll('[data-delivery]').forEach(b=>{const drill=()=>{rememberContext();deliveryDrill={kind:b.dataset.delivery,asof:b.dataset.asof||portfolioEnd,label:({remaining:'Work remaining',completed:'Completed this period',added:'Scope added this period',blocked:'Blocked work',scope:'Total scope',complete:'Completed work',commitment:'Committed work remaining'}[b.dataset.delivery]||b.dataset.delivery.replace('stage:','Stage: '))};workspaceMode='browse';history.pushState({momentum:snapshot()},'',location);render()};b.onclick=drill;if(b.tagName.toLowerCase()==='g')b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();drill()}}});if($('#back-analytics'))$('#back-analytics').onclick=()=>{deliveryDrill=null;workspaceMode='dashboard';updateWorkspace()};main.querySelectorAll('[data-delivery-item]').forEach(b=>b.onclick=()=>openDelivery(b.dataset.deliveryItem))}

function workspaceMarkup(){const list=results();return `<section class="workspace-heading"><div><h1>Explore</h1><p>${workspaceMode==='dashboard'?`${list.length} ideas & solutions · Delivery history`:`${list.length} ${list.length===1?'match':'matches'}${query?' for “'+esc(query)+'”':''}`} · ${scope==='all'?'Across Momentum':'Connected to you'}</p></div><div class="filters workspace-modes" aria-label="Explore view">${[['browse','Browse'],['dashboard','Dashboard']].map(([id,label])=>`<button data-mode="${id}" aria-pressed="${workspaceMode===id}">${label}</button>`).join('')}</div></section><div class="workspace-toolbar"><div class="filters workspace-scopes" aria-label="Workspace scope">${[['all','Everything'],['mine','My work']].map(([id,label])=>`<button data-scope="${id}" aria-pressed="${scope===id}">${label}</button>`).join('')}</div><div class="filters" aria-label="Type">${[['all','All types'],['idea','Ideas'],['solution','Solutions']].map(([id,label])=>`<button data-filter="${id}" aria-pressed="${filter===id}">${label}</button>`).join('')}</div>${scope==='mine'?`<label class="work-select">Show <select id="work-scope" aria-label="My work category">${[['all','All my work'],['mine','Shared by me'],['saved','Saved'],['review','Needs my review']].map(([id,label])=>`<option value="${id}" ${workTab===id?'selected':''}>${label}</option>`).join('')}</select></label>`:''}</div><div id="workspace-content" class="workspace-content">${workspaceMode==='dashboard'?dashboardMarkup(list):deliveryDrill?deliveryDrillMarkup(list):`<section class="workspace-list" aria-labelledby="collection-title"><div class="section-head"><h2 id="collection-title">Ideas & solutions</h2><span>${scope==='mine'?'Your contributions, saves and reviews':'Find something to use or help move forward'}</span></div><div id="collection">${table(list)}</div></section>`}${scope==='mine'&&drafts.length?`<section class="activity"><h2>Your preview drafts</h2>${drafts.map(d=>`<p><strong>${esc(d.title)}</strong> · ${esc(d.kind)} · Not submitted</p>`).join('')}</section>`:''}</div>`}
function render(){
 featuredIndex=((featuredIndex%featured.length)+featured.length)%featured.length;
 document.body.classList.toggle('home-page',view==='home');
 document.body.classList.toggle('workspace-page',view==='explore');
 document.querySelectorAll('nav button').forEach(b=>{if(b.dataset.view===view||(view==='activity'&&b.dataset.view==='home'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 if(view==='home')main.innerHTML=homeMarkup();
 if(view==='explore')main.innerHTML=workspaceMarkup();
 if(view==='activity')main.innerHTML=intro('Recent activity','See what people are sharing, using and helping move forward.')+'<section class="activity-full" aria-label="Recent workspace activity">'+recentActivity.map(activityCard).join('')+'</section>';
 bind();
}
const viewMemory={};
function snapshot(){return {view,filter,query,scope,workspaceMode,workTab,featuredIndex,portfolioProject,portfolioRange,portfolioCadence,portfolioChart,deliveryDrill,scroll:window.scrollY,contentScroll:$('#workspace-content')?.scrollTop||0}}
function rememberContext(){const context=snapshot();viewMemory[view]=context;history.replaceState({momentum:context},'');try{sessionStorage.setItem('momentum-workspace-context-v3',JSON.stringify(context))}catch{}}
function navigate(next,options={}){rememberContext();const previous=viewMemory[next];view=next;if(options.filter!==undefined)filter=options.filter;if(options.query!==undefined)query=options.query;if(options.scope!==undefined)scope=options.scope;if(options.workTab!==undefined)workTab=options.workTab;const url=new URL(location);url.searchParams.delete('project');url.hash=next;history.pushState({momentum:snapshot()},'',url);$('nav').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');render();window.scrollTo(0,previous?.scroll||0);if($('#workspace-content'))$('#workspace-content').scrollTop=previous?.contentScroll||0}
function updateWorkspace(){render();rememberContext()}
function bind(){
 if($('#search-preview'))$('#search-preview').hidden=true;
 const headerInput=$('#header-search input');if(headerInput)headerInput.value=query;

 bindCarousel();
 main.querySelectorAll('[data-activity]').forEach(b=>b.onclick=()=>navigate('activity'));

 main.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>openItem(b.dataset.item));
 main.querySelectorAll('[data-browse]').forEach(b=>b.onclick=()=>{navigate('explore',{filter:b.dataset.browse,query:'',scope:'all'});});
 main.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;updateWorkspace()});
 main.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{workspaceMode=b.dataset.mode;deliveryDrill=null;updateWorkspace()});bindPortfolio();
 main.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;updateWorkspace()});
 if($('#work-scope'))$('#work-scope').onchange=e=>{workTab=e.target.value;updateWorkspace()};
 main.querySelectorAll('[data-review-scope]').forEach(b=>b.onclick=()=>{scope='mine';workTab='review';workspaceMode='browse';updateWorkspace()});
 main.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>{workTab=b.dataset.work;render()});
 const form=$('#header-search .search');
 if(form){form.onsubmit=e=>{e.preventDefault();if(view!=='explore')navigate('explore',{query,filter});else updateWorkspace()};form.querySelector('input').oninput=e=>{
 query=e.target.value;
 if(view!=='explore'){
 const preview=$('#search-preview');preview.hidden=!query.trim();preview.innerHTML=results().length?results().slice(0,3).map(x=>`<button class="search-hit" data-item="${x.id}"><strong>${esc(x.title)}</strong><small>${x.kind==='idea'?'Idea':'Solution'} · ${esc(x.summary)}</small></button>`).join('')+'<button class="search-all" id="search-all">View all matches →</button>':'<p style="padding:12px">No matches. Try another word.</p>';preview.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>openItem(b.dataset.item));if($('#search-all'))$('#search-all').onclick=()=>navigate('explore',{query,filter});
 }else{const input=e.target,start=input.selectionStart;updateWorkspace();input.focus();input.setSelectionRange(start,start)}
 };form.querySelector('input').onkeydown=e=>{if(e.key==='Escape'&&$('#search-preview'))$('#search-preview').hidden=true};}
 if($('#review-nudge'))$('#review-nudge').onclick=()=>{navigate('explore',{scope:'mine',workTab:'review'})};
}
function openItem(id){rememberContext();selected=items.find(x=>x.id===id);if(!selected)return;detailTab='overview';const url=new URL(location);url.searchParams.set('project',id);history.pushState({momentum:snapshot()},'',url);renderDetail();detail.showModal()}
function renderDetail(){const x=selected;$('#detail-kind').textContent=x.kind==='idea'?'An idea to build on':'A solution to use';$('#detail-body').innerHTML=`<h2 id="detail-title">${esc(x.title)}</h2><p>${esc(x.summary)}</p><div class="detail-meta"><span>Shared by ${esc(x.owner)}</span><span>${x.state}</span><span>${x.kind==='idea'?x.votes+' supporters':x.teams+' teams using this'}</span></div><div class="tabs" role="tablist" aria-label="Item detail"><button role="tab" data-detail="overview" aria-selected="${detailTab==='overview'}">Overview</button><button role="tab" data-detail="conversation" aria-selected="${detailTab==='conversation'}">Conversation</button></div><div class="detail-section">${detailTab==='overview'?`<h3>Why it matters</h3><p>${esc(x.why)}</p><h3>${x.kind==='idea'?'Where you could help':'What you can do with it'}</h3><p>${esc(x.description)}</p><ul>${x.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><details><summary>Explore the details</summary><p>${esc(x.technical)}</p><p>Topics: ${x.tags.map(esc).join(', ')}.</p></details>`:`<h3>Bring your perspective</h3><p>A useful question, an experience or an offer to help is a good place to start.</p><div id="comments">${(discussions[x.id]||[]).map(c=>`<p><strong>You</strong><br>${esc(c)}</p>`).join('')||'<p>No conversation in this preview yet.</p>'}</div><form id="comment-form" class="form"><label>Your comment<textarea name="comment" required maxlength="2000" placeholder="What would you add?"></textarea></label><div><button class="secondary" type="submit">Add to preview</button></div></form>`}</div><div class="dialog-actions"><button class="primary" id="next-action">${x.kind==='idea'?'I can help':'Try this with my team'}</button><button class="secondary" id="save">${saved.has(x.id)?'Saved':'Save for later'}</button>${scope==='mine'&&workTab==='review'&&x.review?'<button class="secondary" id="review-action">Review this idea</button>':''}</div><p class="tag">Preview interactions only. Nothing is sent to the live workspace.</p>`;
 $('#detail-body').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{detailTab=b.dataset.detail;renderDetail()});$('#save').onclick=()=>{saved.has(x.id)?saved.delete(x.id):saved.add(x.id);persistPreview();renderDetail();render()};$('#next-action').onclick=()=>{detailTab='conversation';renderDetail();$('#comment-form textarea').focus()};if($('#comment-form'))$('#comment-form').onsubmit=e=>{e.preventDefault();const text=new FormData(e.target).get('comment').trim();if(!text)return;(discussions[x.id]??=[]).push(text);persistPreview();renderDetail();toast('Added to this preview only.')};if($('#review-action'))$('#review-action').onclick=()=>{detailTab='conversation';renderDetail();$('#comment-form textarea').value='My review: ';$('#comment-form textarea').focus();toast('Add your review here. Approval stays in the current app.')};}
function share(kind){$('#share-body').innerHTML=!kind?`<h2 id="share-title">What would you like to share?</h2><p>You don’t need a finished plan. Start with what you know.</p><div class="share-options"><button class="share-option" data-share="idea"><h3>An idea</h3><p>Something we could improve, explore or solve together.</p></button><button class="share-option" data-share="solution"><h3>Something that works</h3><p>A tool, approach or resource another team could use.</p></button></div>`:`<button class="text-button" id="share-back">← Choose something else</button><h2 id="share-title">${kind==='idea'?'Tell us about your idea.':'Share something useful.'}</h2><p>Write it as you would explain it to a teammate.</p><form class="form" id="draft-form"><label>A short name<input name="title" required maxlength="160" placeholder="What should we call it?"></label><label>${kind==='idea'?'What could be better?':'What does it help people do?'}<textarea name="description" required placeholder="A little context goes a long way."></textarea></label><small>You can add links and technical details later.</small><div><button class="primary" type="submit">Save preview draft</button></div></form><p class="tag">This design preview saves your draft for this tab session only.</p>`;$('#share-body').querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>share(b.dataset.share));if($('#share-back'))$('#share-back').onclick=()=>share();if($('#draft-form'))$('#draft-form').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target);drafts.push({kind,title:data.get('title').trim(),description:data.get('description').trim()});persistPreview();shareDialog.close();navigate('explore',{scope:'mine',workTab:'mine'});toast('Draft saved in this preview. It has not been submitted.')};if(!shareDialog.open)shareDialog.showModal()}
let toastTimer;function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$('#share').onclick=()=>share();$('#menu').onclick=()=>{const open=$('nav').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open))};document.querySelectorAll('dialog .close').forEach(b=>b.onclick=()=>b.closest('dialog').close());for(const d of [detail,shareDialog])d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}});
function restoreRoute(){const context=history.state?.momentum;const route=location.hash.slice(1);view=['home','explore','activity'].includes(route)?route:['connections','work','progress'].includes(route)?'explore':'home';if(context){filter=context.filter||'all';query=context.query||'';scope=context.scope||'all';workspaceMode=context.workspaceMode||'browse';workTab=context.workTab||'all';featuredIndex=context.featuredIndex||0;portfolioProject=context.portfolioProject||'all';portfolioRange=context.portfolioRange||'12';portfolioCadence=context.portfolioCadence||'weekly';portfolioChart=context.portfolioChart||'burnup';deliveryDrill=context.deliveryDrill||null}if(route==='work'){scope='mine';workTab='all'}if(route==='progress'&&!context)workspaceMode='dashboard';render();const id=new URL(location).searchParams.get('project');if(id&&items.some(x=>x.id===id)){selected=items.find(x=>x.id===id);detailTab='overview';renderDetail();if(!detail.open)detail.showModal()}else if(detail.open)detail.close();window.scrollTo(0,context?.scroll||0);if($('#workspace-content'))$('#workspace-content').scrollTop=context?.contentScroll||0}
detail.addEventListener('close',()=>{if(new URL(location).searchParams.has('project'))history.back()});
window.addEventListener('popstate',restoreRoute);
try{const context=JSON.parse(sessionStorage.getItem('momentum-workspace-context-v3')||'null');if(context&&!history.state?.momentum)history.replaceState({momentum:context},'')}catch{}
$('#header-search').innerHTML=searchMarkup()+'<div class="search-preview" id="search-preview" hidden></div>';
restoreRoute();
window.addEventListener('pagehide',rememberContext);
</script>
